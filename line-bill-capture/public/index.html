<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINE Bill Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   Bill Capture — ระบบหน้าตา v4 "Soft Dashboard"
   พื้นไล่สีพาสเทล · การ์ดขาวมุมมน · ตัวเลขใหญ่ + ป้ายสถานะ
   สไตล์ชีตเดียวจบ (เดิมมี 5 ก้อนทับกัน) — ห้ามเพิ่มก้อนใหม่ทับ
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#F7F7F5; --card:#FFFFFF;
  --ink:#14171C; --ink-2:#5A626E; --ink-3:#949BA6; --ink-4:#C3C8D0;
  --line:#EDEEF1; --line-2:#E2E4E9;
  --mint:#D8F3E0;  --mint-ink:#177A45;
  --peach:#FFE3D6; --peach-ink:#C1471B;
  --sky:#DCE8FF;   --sky-ink:#2C5AC4;
  --lilac:#E9E4FB; --lilac-ink:#5B44B8;
  --lemon:#FBEFC9; --lemon-ink:#8A6A12;
  --rose:#FFDFE0;  --rose-ink:#BE2F3C;
  --green:#22A45D; --r:20px;
  /* alias ของเดิม เพื่อให้ inline style เก่าที่ยังอ้างอยู่ไม่พัง */
  --panel:#fff; --soft:#FAFAF9; --text:#14171C; --muted:#949BA6;
  --blue:#2C5AC4; --blueSoft:#DCE8FF; --greenSoft:#D8F3E0;
  --amber:#8A6A12; --amberSoft:#FBEFC9; --red:#BE2F3C; --redSoft:#FFDFE0;
  --edge:#EDEEF1;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Anuphan',system-ui,sans-serif;font-size:14px;line-height:1.55;
  font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
h1,h2,h3,p,dl,dd,dt,figure{margin:0}
[hidden]{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
a{color:inherit}

/* ── โครงหลัก ─────────────────────────────────────────── */
@property --railw{syntax:"<length>";inherits:true;initial-value:236px}
.app{display:grid;grid-template-columns:var(--railw,236px) minmax(0,1fr);min-height:100vh;
  --railw:236px;transition:--railw .3s cubic-bezier(.4,0,.2,1)}
.app.narrow{--railw:74px}

/* ── แถบข้าง ──────────────────────────────────────────── */
.rail{position:sticky;top:0;height:100vh;width:100%;padding:22px 14px;
  display:flex;flex-direction:column;gap:22px;background:var(--bg);
  transition:padding .3s cubic-bezier(.4,0,.2,1)}
.railtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 0 6px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .mark{width:32px;height:32px;flex:none;border-radius:11px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:15px;font-weight:600}
.logo b{font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden}
.railtoggle{width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;
  border:0;background:none;color:var(--ink-3);transition:.16s}
.railtoggle svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.railtoggle:hover{background:#EFEFEC;color:var(--ink)}
.railnav{display:flex;flex-direction:column;gap:3px}
.railcap{padding:10px 12px 5px;color:var(--ink-4);font-size:10.5px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase}
.ritem{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;border-radius:13px;
  background:none;color:var(--ink-2);font-size:13.5px;font-weight:500;transition:.16s;
  text-align:left;width:100%;white-space:nowrap}
.ritem svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.lb{overflow:hidden;text-overflow:ellipsis}
.ritem:hover{background:#EFEFEC;color:var(--ink)}
.ritem.on{background:var(--ink);color:#fff}
.ritem .count{margin-left:auto;min-width:21px;height:21px;padding:0 6px;border-radius:11px;
  background:var(--rose);color:var(--rose-ink);font-size:11px;font-weight:600;
  display:grid;place-items:center}
.ritem.on .count{background:#FFFFFF26;color:#fff}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.railnote{padding:12px 14px;border-radius:15px;background:#EFEFEC;color:var(--ink-2);
  font-size:11.5px;line-height:1.5;display:grid;gap:3px}
.railnote .tag{justify-self:start}
/* สถานะหุบ */
.app.narrow .rail{padding:22px 12px;align-items:center}
.app.narrow .railtop{flex-direction:column;gap:10px;padding:0}
.app.narrow .logo b,.app.narrow .railcap,.app.narrow .railnote,.app.narrow .lb{display:none}
.app.narrow .railtoggle svg{transform:rotate(180deg)}
.app.narrow .railnav,.app.narrow .railfoot{width:100%}
.app.narrow .ritem{justify-content:center;padding:11px 0;position:relative}
.app.narrow .ritem .count{position:absolute;top:3px;right:8px;margin:0;min-width:17px;height:17px;
  padding:0 4px;font-size:9.5px}
.app.narrow .ritem::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;
  transform:translateY(-50%) translateX(-5px);padding:7px 12px;border-radius:11px;
  background:var(--ink);color:#fff;font-size:12px;font-weight:500;white-space:nowrap;
  opacity:0;pointer-events:none;transition:.17s;z-index:60;box-shadow:0 8px 22px #14171C24}
.app.narrow .ritem:hover::after{opacity:1;transform:translateY(-50%)}

/* ── ผืนงาน ───────────────────────────────────────────── */
.canvas{position:relative;margin:10px 10px 10px 0;padding:18px 24px 32px;
  border-radius:24px;overflow:hidden;background:#FCFCFB;min-width:0}
.canvas::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.9;
  background:
    radial-gradient(760px 420px at 6% -6%,  #FFE9DC 0%, transparent 62%),
    radial-gradient(680px 400px at 52% -12%,#FDF3D8 0%, transparent 60%),
    radial-gradient(900px 520px at 104% 2%, #DFF4E6 0%, transparent 64%),
    radial-gradient(680px 460px at 88% 62%, #E9E7FB 0%, transparent 62%)}
.canvas>*{position:relative;z-index:1}

/* ── แถบบน ────────────────────────────────────────────── */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top .spacer{margin-left:auto}
.search{flex:1;max-width:380px;display:flex;align-items:center;gap:9px;padding:10px 15px;
  border-radius:14px;background:#FFFFFFC9;border:1px solid #fff;color:var(--ink-3);font-size:13px}
.search svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.globalsearch{position:relative;flex:1;max-width:390px;min-width:230px}
.globalsearchbox{display:flex;align-items:center;gap:9px;padding:0 11px 0 14px;border:1px solid #fff;
  border-radius:14px;background:#FFFFFFC9;transition:.16s}
.globalsearchbox:focus-within{background:#fff;border-color:var(--line-2);box-shadow:0 0 0 3px #DCE8FF66}
.globalsearchbox svg{width:16px;height:16px;flex:none;stroke:var(--ink-3);fill:none;stroke-width:1.8}
.globalsearchbox input{width:100%;min-width:0;height:38px;padding:0;border:0;outline:0;background:transparent;
  color:var(--ink);font-size:12.5px}
.globalsearchbox input::placeholder{color:var(--ink-3)}
.searchclear{width:27px;height:27px;flex:none;border:0;border-radius:9px;background:none;color:var(--ink-3);font-size:16px}
.searchclear:hover{background:#F1F1EF;color:var(--ink)}
.searchresults{position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:65;max-height:430px;overflow:auto;
  padding:7px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 18px 42px #14171C22}
.searchstate{padding:20px 14px;text-align:center;color:var(--ink-3);font-size:12px}
.searchresult{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;
  padding:9px;border:0;border-radius:12px;background:#fff;color:var(--ink);text-align:left;text-decoration:none;transition:.14s}
.searchresult:hover,.searchresult.active{background:#F5F5F3}
.searchresult img{width:42px;height:48px;border-radius:10px;object-fit:cover;background:#F1F1EF}
.searchresultbody{min-width:0;display:grid;gap:2px}.searchresulttitle{font-size:12.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.searchresultmeta{color:var(--ink-3);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.searchresultside{text-align:right;display:grid;gap:3px}.searchresultside strong{font-size:12px;font-weight:600}
.searchresultside small{color:var(--ink-3);font-size:9.5px}
.select{min-height:36px;padding:8px 28px 8px 12px;border:1px solid #fff;border-radius:13px;
  background:#FFFFFFC9;font-size:12.5px;font-weight:500;color:var(--ink-2);min-width:170px}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tools .btn,.chipbtn{min-height:36px;padding:8px 13px;border:1px solid #fff;border-radius:13px;
  background:#FFFFFFC9;color:var(--ink-2);font-size:12.5px;font-weight:500;transition:.16s}
.tools .btn:hover,.chipbtn:hover{background:#fff;color:var(--ink)}
.tools .btn:disabled{opacity:.5;cursor:default}
.reread-btn{display:inline-flex;align-items:center;gap:6px;border-color:#F0D9C6;background:#FFF6F0;color:var(--peach-ink)}
.reread-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.reread-btn:hover{background:var(--peach);color:var(--peach-ink);border-color:#E8C0A6}
.tag.ai{position:relative;overflow:hidden}
.tag.ai.working{background:var(--lemon);color:var(--lemon-ink)}
.tag.ai.working::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:var(--p,0%);background:var(--lemon-ink);border-radius:0 3px 3px 0;transition:width .45s ease}
.tag.ai.idlequeue{background:#F1F1EF;color:var(--ink-3)}
.aimenu{position:relative}.aimenu-toggle{display:inline-flex;align-items:center;gap:7px}
.aimenu-toggle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;transition:.16s}
.aimenu.open .aimenu-toggle svg{transform:rotate(180deg)}
.aimenu-pop{position:absolute;right:0;top:calc(100% + 7px);z-index:55;width:230px;padding:7px;
  border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 16px 38px #14171C1C}
.aimenu-pop .btn{display:grid;width:100%;gap:2px;min-height:0;padding:10px 11px;border:0;border-radius:11px;
  background:#fff;text-align:left;color:var(--ink)}
.aimenu-pop .btn:hover{background:#F5F5F3}.aimenu-pop .btn strong{font-size:12.5px;font-weight:600}
.aimenu-pop .btn small{color:var(--ink-3);font-size:10.5px;font-weight:400}

/* ── ป้าย/ชิป ─────────────────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  background:#F3F3F1;color:var(--ink-2);font-size:11.5px;font-weight:600;white-space:nowrap;border:0}
.tag.ai{background:var(--mint);color:var(--mint-ink)}
.tag.good,.good{background:var(--mint)!important;color:var(--mint-ink)!important;border-color:transparent!important}
.tag.review,.review{background:var(--lemon)!important;color:var(--lemon-ink)!important;border-color:transparent!important}
.tag.risk,.risk{background:var(--rose)!important;color:var(--rose-ink)!important;border-color:transparent!important}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:600;line-height:1.6}
.chip.c-review{background:var(--lemon);color:var(--lemon-ink)}
.chip.c-risk{background:var(--rose);color:var(--rose-ink)}
.chip.c-slip{background:var(--sky);color:var(--sky-ink)}
.chip.c-bill{background:var(--lilac);color:var(--lilac-ink)}
.chip.c-good{background:var(--mint);color:var(--mint-ink)}
.muted,.sub{color:var(--ink-3);font-size:12px}

/* ── ปุ่ม ─────────────────────────────────────────────── */
.btn{min-height:36px;padding:9px 15px;border:1px solid var(--line-2);border-radius:12px;
  background:#fff;color:var(--ink-2);font-size:12.5px;font-weight:600;transition:.16s}
.btn:hover{border-color:var(--ink-4);color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#2C313A;border-color:#2C313A;color:#fff}
.btn.danger{background:var(--rose);border-color:transparent;color:var(--rose-ink)}
.btn.danger:hover{background:#FFCFD1;color:var(--rose-ink)}
.btn:disabled{opacity:.5;cursor:default}
.input,.textarea{width:100%;min-height:38px;padding:9px 12px;border:1px solid var(--line-2);
  border-radius:12px;background:#fff;color:var(--ink)}
.textarea{resize:vertical}
.input:focus,.textarea:focus{outline:2px solid var(--sky);outline-offset:-1px;border-color:var(--sky-ink)}
.input.readonly,.readonly{background:#F5F5F3;color:var(--ink-2)}
.datepick{min-height:36px;padding:8px 10px;border:1px solid var(--line-2);border-radius:12px;background:#fff}

/* ── การ์ด/แผง ────────────────────────────────────────── */
.panel,.card{background:var(--card);border:1px solid #fff;border-radius:var(--r);
  box-shadow:0 1px 2px #14171C08,0 12px 30px #14171C05;min-width:0;overflow:hidden}
.head{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--line)}
.head h2{font-size:15px;font-weight:600}
.empty{min-height:260px;padding:30px;display:grid;place-items:center;text-align:center;
  color:var(--ink-3);font-size:13px}

/* ══ หน้าแรก · ภาพรวมรายเดือน ══ */
.board{padding:0}
.board-home{display:grid;gap:16px}
.month-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.month-title{display:grid;gap:3px}
.month-title strong{font-size:25px;font-weight:600;letter-spacing:0}
.month-title span{font-size:12px;color:var(--ink-3)}
.month-nav{display:flex;align-items:center;gap:5px}
.month-nav .btn{min-height:36px;border-radius:12px}
.month-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.month-stat{padding:17px 18px;border:1px solid #fff;border-radius:var(--r);background:var(--card);
  box-shadow:0 1px 2px #14171C08,0 12px 30px #14171C05;text-align:left;min-width:0}
.month-stat span{display:block;color:var(--ink-2);font-size:12px;font-weight:500}
.month-stat strong{display:block;margin:10px 0 7px;font-size:36px;font-weight:600;line-height:1;letter-spacing:0}
.month-stat small{display:block;color:var(--ink-3);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month-stat.alert strong{color:var(--rose-ink)}
.month-stat.review strong{color:var(--lemon-ink)}
.month-stat.unmatched strong{color:var(--sky-ink)}
.month-stat.closed strong{color:var(--mint-ink)}
.board-columns{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.board-card{padding:20px;background:var(--card);border:1px solid #fff;border-radius:var(--r);
  box-shadow:0 1px 2px #14171C08,0 12px 30px #14171C05;min-width:0}
.board-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.board-card-head h2{font-size:15px;font-weight:600}
.board-card-head p{margin-top:2px;color:var(--ink-3);font-size:11.5px}
.status-matrix{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.matrix-head{text-align:center;color:var(--ink-4);font-size:10.5px;font-weight:600;padding-bottom:2px}
.matrix-cell{position:relative;aspect-ratio:1;border:1.5px solid transparent;border-radius:13px;
  background:#F6F6F4;display:grid;place-items:center;align-content:center;color:var(--ink-3);min-width:0}
.matrix-cell.has{cursor:pointer;transition:.16s}
.matrix-cell.has:hover{transform:scale(1.06)}
.matrix-cell .day{font-size:12.5px;font-weight:600;line-height:1}
.matrix-cell .state{margin-top:4px;font-size:9px;font-weight:600;line-height:1;white-space:nowrap}
.matrix-cell.done{background:var(--mint);color:var(--mint-ink)}
.matrix-cell.ready{background:var(--sky);color:var(--sky-ink)}
.matrix-cell.busy{background:var(--peach);color:var(--peach-ink)}
.matrix-cell.late{background:var(--rose);color:var(--rose-ink)}
.matrix-cell.today{border-color:var(--ink)}
.matrix-key{display:flex;flex-wrap:wrap;gap:11px;margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}
.matrix-key span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:10.5px}
.matrix-key i{width:10px;height:10px;border-radius:3px}.matrix-key .done{background:var(--mint)}
.matrix-key .ready{background:var(--sky)}.matrix-key .busy{background:var(--peach)}.matrix-key .late{background:var(--rose)}
.month-calendar-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px 5px}
.month-calendar{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:7px;min-width:875px}
.calendar-weekday{padding:3px 8px 7px;color:var(--ink-3);font-size:10.5px;font-weight:600;text-align:center}
.calendar-day{min-height:132px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#FAFAF8;display:flex;flex-direction:column;gap:7px;min-width:0}
.calendar-day.outside{border-color:transparent;background:transparent}
.calendar-day[data-open-date]{cursor:pointer;transition:.14s}
.calendar-day[data-open-date]:hover{border-color:var(--ink-4);background:#fff;box-shadow:0 4px 14px #14171C0A}
.calendar-day[data-open-date]:focus-visible{outline:2px solid var(--sky-ink);outline-offset:2px}
.calendar-day.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.calendar-day-head{display:flex;align-items:center;justify-content:space-between;gap:5px;min-height:21px}
.calendar-day-number{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;font-size:12.5px;font-weight:600}
.calendar-day.today .calendar-day-number{background:var(--ink);color:#fff}
.calendar-day-state{color:var(--ink-3);font-size:9.5px;font-weight:600;white-space:nowrap}
.calendar-day-state.done{color:var(--mint-ink)}.calendar-day-state.ready{color:var(--sky-ink)}
.calendar-day-state.busy{color:var(--peach-ink)}.calendar-day-state.late{color:var(--rose-ink)}
.calendar-runs{display:grid;gap:5px}
.calendar-run{display:grid;grid-template-columns:7px minmax(0,1fr) auto;align-items:center;gap:6px;min-height:30px;padding:6px 7px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);text-decoration:none;transition:.14s}
.calendar-run:hover{border-color:var(--gc);box-shadow:0 2px 8px #14171C0D;transform:translateY(-1px)}
.calendar-run i{width:7px;height:7px;border-radius:50%;background:var(--gc)}
.calendar-run span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;font-weight:600}
.calendar-run b{font-size:9.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.calendar-run.done b{color:var(--mint-ink)}.calendar-run.ready b{color:var(--sky-ink)}
.calendar-run.busy b{color:var(--peach-ink)}.calendar-run.late b{color:var(--rose-ink)}
.calendar-day-state.imported,.calendar-run.imported b{color:#5B6472}
.calendar-empty{margin:auto;color:var(--ink-4);font-size:9.5px}
.calendar-total{margin-top:auto;padding-top:5px;border-top:1px solid var(--line);color:var(--ink-3);font-size:9.5px;text-align:right;font-variant-numeric:tabular-nums}
.round-table-wrap{overflow:auto;margin:0 -8px -8px;padding:0 8px 8px}
.round-table{width:100%;border-collapse:collapse;min-width:690px}
.round-table th{padding:0 10px 10px;text-align:left;color:var(--ink-3);font-size:10.5px;font-weight:600;white-space:nowrap}
.round-table th.r,.round-table td.r{text-align:right}
.round-table td{padding:10px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.round-table tbody tr{cursor:pointer;transition:.14s}
.round-table tbody tr:hover td{background:#FBFBFA}
.round-identity{display:flex;align-items:center;gap:9px}.round-day{width:36px;height:36px;border-radius:11px;
  background:#F5F5F3;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.round-group{display:grid;gap:2px;font-size:12px;font-weight:600}.round-group small{color:var(--ink-3);font-size:9.5px;font-weight:400}
.round-group i{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:var(--gc)}
.round-count{font-size:14px;font-weight:600}.round-count.zero{color:var(--ink-4);font-weight:400}
.round-progress{width:94px;height:6px;border-radius:4px;background:#F1F1EF;overflow:hidden;display:flex}
.round-progress i{display:block;height:100%}.round-progress .confirmed{background:#BFE8CE}
.round-progress .pending{background:#F6C89A}.round-progress .unmatched{background:#A9C4F5}
.round-total{font-size:12px;font-weight:600;color:var(--mint-ink)}
.round-empty{padding:32px;text-align:center;color:var(--ink-3);font-size:12px}

/* ── การ์ดวัน (ยังใช้ในบางเส้นทาง) ── */
.boardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.daycard{position:relative;display:grid;gap:9px;padding:16px;border:1px solid #fff;border-radius:var(--r);
  background:var(--card);box-shadow:0 1px 2px #14171C08;text-align:left;text-decoration:none;
  color:var(--ink);transition:.16s;overflow:hidden}
.daycard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gc,#C3C8D0)}
.daycard:hover{transform:translateY(-2px);box-shadow:0 8px 24px #14171C12}
.daycard.closed{background:#F8FDFA}
.dc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dc-date{font-size:15px;font-weight:600}
.dc-group{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.gdot{width:7px;height:7px;border-radius:50%;background:var(--gc,#C3C8D0);flex:none}
.dc-bar{height:5px;border-radius:3px;background:#F1F1EF;overflow:hidden}
.dc-bar span{display:block;height:100%;background:var(--green);border-radius:3px}
.dc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px}
.dc-num{font-size:11.5px;color:var(--ink-3);font-weight:500}
.dc-chips{display:flex;gap:5px;flex-wrap:wrap}
.dc-total{font-size:13px;font-weight:600;color:var(--mint-ink)}

/* ══ หน้าวัน · แถบหัว ══ */
#daychrome{margin-bottom:14px}
.backbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 0 14px}
.backbar strong{font-size:20px;font-weight:600;letter-spacing:-.02em}
.backbar .spacer{margin-left:auto}
.backbar .btn{min-height:36px}
.reopenbanner{padding:12px 15px;border-radius:15px;background:var(--rose);color:var(--rose-ink);
  font-size:12.5px;font-weight:500;margin-bottom:12px}

/* ══ หน้าวัน · พื้นที่ทำงาน ══ */
/* ความกว้างแชทลากปรับได้ · เก็บค่าฐานไว้ที่ --chatbase
   พอหุบแถบข้าง (236px→74px) จะยกพื้นที่ที่ได้คืน 162px ให้แชททั้งหมด */
@property --chatw{syntax:"<length>";inherits:true;initial-value:318px}
.layout,.day-workspace{display:grid;grid-template-columns:var(--chatw) minmax(0,1fr);
  gap:14px;align-items:start;padding:0;position:relative;
  --chatbase:318px;--chatw:var(--chatbase)}
.app.narrow .day-workspace{--chatw:calc(var(--chatbase) + 162px)}
.chatresize{position:absolute;top:0;bottom:0;left:var(--chatw);width:15px;margin-left:-1px;
  border:0;background:none;padding:0;cursor:col-resize;z-index:6;touch-action:none}
.chatresize::before{content:'';position:absolute;top:0;bottom:0;left:6px;width:3px;border-radius:3px;
  background:transparent;transition:background .15s}
.chatresize:hover::before,.chatresize:focus-visible::before,.chatresize.dragging::before{background:var(--ink-4)}
.chatresize:focus-visible{outline:none}
body.chat-resizing{cursor:col-resize;user-select:none}
.chatpanel{display:flex;flex-direction:column;max-height:calc(100vh - 190px);position:sticky;top:14px}
.chatpanelhead{padding:15px 16px 12px;border-bottom:1px solid var(--line);display:flex;
  align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chatpanelmeta h2{font-size:14.5px;font-weight:600}
.chatnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chatnav .btn{min-height:30px;padding:5px 10px;font-size:11.5px;border-radius:10px}
.chatrange{color:var(--ink-3);font-size:11px}
.workpanel{display:flex;flex-direction:column;min-width:0}
.worktools{border-bottom:1px solid var(--line)}
.queuebar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:13px 18px 10px}
.queuebar strong{font-size:14.5px;font-weight:600}
.queuebar .muted{font-variant-numeric:tabular-nums}

/* ถังงาน */
.buckets{display:flex;gap:5px;padding:12px 14px 0;overflow-x:auto;scrollbar-width:none;flex-wrap:wrap}
.buckets::-webkit-scrollbar{display:none}
.bucket{display:flex;align-items:center;gap:7px;padding:7px 13px;border:0;border-radius:11px;
  background:#F5F5F3;color:var(--ink-2);font-size:12.5px;font-weight:500;white-space:nowrap;
  transition:.16s;text-align:left}
.bucket .dot{display:none}
.bucket b{font-size:11px;font-weight:600;color:var(--ink-3)}
.bucket:hover{background:#EDEDEA;color:var(--ink)}
.bucket.zero{opacity:.45}
.bucket.active{background:var(--ink);color:#fff}
.bucket.active b{color:#FFFFFFAB}
.bucket.t-review.active{background:var(--lemon-ink)}
.bucket.t-risk.active{background:var(--rose-ink)}
.bucket.t-slip.active{background:var(--sky-ink)}
.bucket.t-bill.active{background:var(--lilac-ink)}
.bucket.t-good.active{background:var(--mint-ink)}
.bhint{padding:10px 16px 0;font-size:11.5px;color:var(--ink-3);background:none;border:0}

/* คิวงาน */
.list,.workqueue{max-height:none;overflow:visible;padding:0 12px 12px;display:grid;gap:8px}
.row{width:100%;display:grid;gap:7px;padding:12px 13px;border:1px solid var(--line);
  border-radius:15px;background:#FBFBFA;text-align:left;transition:.16s}
.row:hover{background:#fff;border-color:var(--line-2);transform:translateX(2px)}
.row.active{background:#fff;border-color:var(--ink);box-shadow:0 2px 10px #14171C0F}
.rowmain,.rowmeta{display:flex;justify-content:space-between;gap:10px;align-items:start}
.rowmeta{align-items:center;color:var(--ink-3);font-size:11.5px}
.title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:600}
.amount{font-size:14px;font-weight:600;white-space:nowrap;letter-spacing:-.02em}
.irow{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;padding:11px 12px;
  border:1px solid var(--line);border-radius:15px;background:#FBFBFA;align-items:center;transition:.16s}
.irow:hover{background:#fff;border-color:var(--line-2);transform:translateX(2px)}
.irow.active{background:#fff;border-color:var(--ink);box-shadow:0 2px 10px #14171C0F}
.ithumb{width:46px;height:46px;border-radius:13px;overflow:hidden;background:#F1F1EF;display:block}
.ithumb img{width:100%;height:100%;object-fit:cover;display:block}
.imain{min-width:0;display:grid;gap:3px}
.ititle{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imeta{font-size:11.5px;color:var(--ink-3);display:flex;gap:9px;flex-wrap:wrap}
.iact{grid-column:1/-1;display:flex;gap:7px;align-items:center}
.iact .input{min-height:34px;padding:6px 10px;font-size:12.5px}
.iact .btn{min-height:34px;padding:6px 12px;font-size:11.5px;white-space:nowrap}
.donepairrow{grid-template-columns:auto minmax(0,1fr)}
.donepairthumbs{display:flex;gap:5px}
.donepairthumbs .ithumb{width:38px;height:38px;border-radius:11px}
.donepairmeta{color:var(--ink-4);font-size:10.5px}

/* แผงตรวจ */
#reviewpanel{padding:4px 18px 18px}
.reviewhead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:14px 0 13px;border-bottom:1px solid var(--line)}
.reviewhead h2{font-size:20px;font-weight:600;letter-spacing:-.02em}
.reviewbody{padding:16px 0 0}
.signals{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:14px}
.signal{min-width:0;padding:14px 15px;border:1px solid var(--line);border-radius:16px;background:#FAFAF9}
.signal span{display:block;color:var(--ink-3);font-size:11.5px;font-weight:500}
.signal strong{display:block;margin-top:7px;font-size:20px;font-weight:600;letter-spacing:-.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signal.good{background:#F4FBF7!important;border-color:#CDEBDA!important}
.signal.good strong{color:var(--mint-ink)}
.signal.review{background:#FFFBF0!important;border-color:#F0E2BC!important}
.signal.review strong{color:var(--lemon-ink)}
.signal.risk{background:#FFF6F6!important;border-color:#F7D3D5!important}
.signal.risk strong{color:var(--rose-ink)}
.summary{padding:12px 15px;margin-bottom:14px;border:1px solid var(--line);border-radius:15px;
  font-size:12.5px;color:var(--ink-2);background:#FAFAF9}
.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.doc{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#FBFBFA}
.dochead{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dochead h3{font-size:13px;font-weight:600}
.preview{min-height:280px;display:grid;place-items:center;background:#fff;overflow:hidden;
  margin:0 11px;border-radius:12px;cursor:zoom-in}
.preview img{max-width:100%;max-height:54vh;object-fit:contain}
.docmeta{padding:12px 15px;display:grid;gap:6px;color:var(--ink-3);font-size:11.5px}
.docmeta strong{color:var(--ink);font-weight:600}
.itemdetail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr);gap:18px;padding-top:16px}
.itemvisual{display:block;border:1px solid var(--line);border-radius:17px;overflow:hidden;
  background:#fff;padding:10px;cursor:zoom-in;transition:.16s}
.itemvisual:hover{border-color:var(--ink-4)}
.itemvisual img{display:block;width:100%;max-height:52vh;object-fit:contain}
.itemdecision{display:grid;gap:14px;align-content:start}
.itemdecision h3{font-size:14.5px;font-weight:600}
.itemfacts{display:grid;gap:0}
.itemfacts>div{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:8px 0;border-bottom:1px solid var(--line)}
.itemfacts span{color:var(--ink-3);font-size:11.5px}
.itemfacts strong{font-size:12.5px;font-weight:600;text-align:right;min-width:0}
.primarytask{padding:15px 16px;border-radius:17px;background:#FAFAF9;border:1px solid var(--line);
  display:grid;gap:10px}
.primarytask label{color:var(--ink-2);font-size:12.5px;font-weight:500}
.primarytask .actions{display:flex;gap:8px;flex-wrap:wrap}
.tasknote{padding:13px 15px;border-radius:15px;background:#FAFAF9;border:1px solid var(--line);
  color:var(--ink-2);font-size:12.5px;line-height:1.55}
.pagesbox{margin-top:14px;padding:13px 15px;border:1px solid var(--line);border-radius:17px;background:#FAFAF9}
.pageshead{font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:9px}
.pagesgrid{display:flex;gap:9px;flex-wrap:wrap}
.pagethumb{display:block;width:74px;border:1px solid var(--line);border-radius:11px;overflow:hidden;
  background:#fff;text-decoration:none;transition:.14s}
.pagethumb img{display:block;width:100%;height:88px;object-fit:cover}
.pagethumb span{display:block;padding:4px;text-align:center;font-size:10px;font-weight:600;color:var(--ink-2)}
.pagethumb:hover{border-color:var(--ink)}
.pairfeedback{display:grid;gap:8px;margin-top:16px;padding:15px 16px;border:1px solid var(--line);
  border-radius:17px;background:#FAFAF9}
.pairfeedback label{color:var(--ink-2);font-size:12px;font-weight:500}
.learncheck{display:flex;align-items:center;gap:8px}
.bar{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-top:18px;padding:14px 0;border-top:1px solid var(--line);
  background:linear-gradient(to top,var(--card) 72%,transparent)}
.bar>span{flex:1;min-width:180px;color:var(--ink-3);font-size:12px}
.bar .actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form{display:grid;gap:10px}
.form label{display:grid;gap:5px;color:var(--ink-2);font-size:12px}
.box{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#FAFAF9;
  white-space:pre-wrap;font-size:12px;line-height:1.55;color:var(--ink-2)}
.section{display:grid;gap:10px;align-content:start}
.section h3{font-size:13px;font-weight:600}
details{margin-top:14px;border:1px solid var(--line);border-radius:17px;background:#FAFAF9;overflow:hidden}
summary{padding:13px 16px;cursor:pointer;font-size:12.5px;font-weight:600}
.detailsbody{padding:0 16px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.done-summary{background:var(--mint);border-color:transparent;color:var(--mint-ink)}
.process-reveal{outline:2px solid var(--sky-ink);outline-offset:3px;border-radius:var(--r)}
.classifybox{display:grid;gap:9px;padding:13px 14px;border:1px solid var(--line);border-radius:16px;background:#fff}
.classifybox>span{color:var(--ink-3);font-size:11.5px;font-weight:500}
.classifybox .actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.classifybox .btn.current{background:var(--ink);border-color:var(--ink);color:#fff;cursor:default}

/* ══ แชท ══ */
.chatlog{display:grid;gap:11px;padding:14px 15px 18px;background:none;max-height:none;
  overflow:auto;border-radius:0;align-content:start;flex:1}
.chatdateblock{display:grid;gap:11px;padding:10px 0;border-radius:14px}
.chatdateblock.day-blue{background:#F6F8FC;margin:0 -8px;padding:10px 8px}
.chatday{justify-self:center;padding:4px 12px;border-radius:999px;background:#F3F3F1;
  color:var(--ink-3);font-size:10.5px;font-weight:600}
.chatfloatingdate{position:sticky;top:0;z-index:4;justify-self:center;padding:4px 12px;
  border-radius:999px;background:#14171CE0;color:#fff;font-size:10.5px;font-weight:600}
.chatmsg{display:grid;grid-template-columns:30px minmax(0,1fr);gap:9px;align-items:start;max-width:100%}
.chatavatar{width:30px;height:30px;border-radius:10px;object-fit:cover;
  background:linear-gradient(135deg,#E4EEFB,#F6E6DC);border:0}
.chatavatar-fallback{display:grid;place-items:center;color:#6B7484;font-size:11px;font-weight:600}
.chatcontent{min-width:0}
.chatname{margin:0 0 3px 2px;color:var(--ink-3);font-size:11px;font-weight:600;text-shadow:none}
.chatbubble{display:inline-block;max-width:100%;padding:9px 12px;border-radius:4px 15px 15px 15px;
  background:#F5F5F3;box-shadow:none;color:var(--ink);font-size:12.5px;line-height:1.5;
  white-space:pre-wrap;overflow-wrap:anywhere}
.chatbubble.image{padding:0;background:none}
.chatmsg.focus .chatbubble{background:var(--lemon);color:#5E4A0E}
.chatimageactions{display:flex;align-items:flex-start;gap:8px}
.chatimagebutton{flex:1;min-width:0}
.chatimageside{display:flex;flex-direction:column;gap:6px;flex:none;padding-top:2px}
.chatimagebutton{display:block;padding:0;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;background:#F1F1EF;cursor:zoom-in;transition:.16s}
.chatimagebutton:hover{border-color:var(--ink-4)}
.chatimage{display:block;width:100%;max-width:100%;max-height:340px;border-radius:0;
  object-fit:cover;background:#F1F1EF}
.chatprocess,.chatlinkedslip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;
  border:1px solid var(--line-2);border-radius:999px;background:#fff;font-size:10.5px;
  font-weight:600;color:var(--ink-2);transition:.16s;line-height:1.25;justify-self:start;
  flex-direction:column;gap:1px;padding:7px 9px;border-radius:12px;text-align:center;white-space:nowrap}
/* ปุ่มไปยังถังงานในแชท ใช้สีเดียวกับแท็บถังงาน เพื่อให้สีหมายถึงสิ่งเดียวกันทั้งระบบ */
.chatprocess.t-good{background:var(--mint);border-color:transparent;color:var(--mint-ink)}
.chatprocess.t-review{background:var(--lemon);border-color:transparent;color:var(--lemon-ink)}
.chatprocess.t-risk{background:var(--rose);border-color:transparent;color:var(--rose-ink)}
.chatprocess.t-slip{background:var(--sky);border-color:transparent;color:var(--sky-ink)}
.chatprocess.t-bill{background:var(--lilac);border-color:transparent;color:var(--lilac-ink)}
.chatprocess.t-other{background:#F1F1EF;border-color:transparent;color:var(--ink-3)}
.chatprocess:hover,.chatlinkedslip:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.chattime{display:inline-block;margin:5px 0 0 2px;color:var(--ink-4);font-size:10px;text-shadow:none}
.chatline-id{display:block;margin-top:4px;color:var(--ink-4);font-size:9px}
.chatmissing{padding:24px;color:var(--ink-3);text-align:center;font-size:12.5px}
.chatother{border:1px solid var(--line);border-radius:14px;background:#FBFBFA;overflow:hidden}
.chatother summary{padding:9px 12px;font-size:11.5px;font-weight:500;display:flex;
  justify-content:space-between;gap:8px;align-items:center}
.chatother summary small{color:var(--ink-4);font-size:10px}
.chatother.chatmatched{background:#F4FBF7;border-color:#CDEBDA}
.chatotherbody{padding:0 10px 10px}
.chatloadday{display:grid;gap:2px;justify-items:center;padding:10px;border:1px dashed var(--line-2);
  border-radius:14px;background:#FBFBFA;color:var(--ink-2);font-size:11.5px;font-weight:600;transition:.16s}
.chatloadday small{color:var(--ink-4);font-size:10px;font-weight:400}
.chatloadday:hover{border-color:var(--ink-4);background:#fff;color:var(--ink)}
.chatloadday:disabled{opacity:.5;cursor:default}
.reveal{outline:2px solid var(--lemon-ink);outline-offset:3px;border-radius:12px}

/* ══ ลิ้นชัก ══ */
.drawerbg{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;
  background:#14171C55;backdrop-filter:blur(2px)}
.drawerbg[hidden]{display:none}
.drawer,.flagdrawer{width:min(470px,100%);height:100%;background:var(--card);
  box-shadow:-18px 0 46px #14171C2E;display:grid;grid-template-rows:auto 1fr}
.flagdrawer{width:min(660px,100%);display:block;overflow:auto;padding:18px}
.drawerhead{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;gap:12px;align-items:flex-start}
.drawerhead h2{font-size:17px;font-weight:600}
.flagdrawer .drawerhead{position:sticky;top:-18px;z-index:2;margin:-18px -18px 16px;
  padding:17px 18px;background:var(--card)}
.drawerlist{padding:14px;overflow:auto;display:grid;align-content:start;gap:9px}
.candidate{padding:13px;border:1px solid var(--line);border-radius:16px;background:#FBFBFA;
  text-align:left;display:grid;gap:7px;transition:.16s}
.candidate:hover{border-color:var(--ink-4);background:#fff;transform:translateX(2px)}
.candtop{display:flex;justify-content:space-between;gap:9px;align-items:center}
.candtitle{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.billcandidate{grid-template-columns:58px minmax(0,1fr);display:grid;gap:12px;align-items:center}
.billcandidate>img{width:58px;height:70px;object-fit:cover;border-radius:12px;background:#F1F1EF}
.candidatebody{display:grid;gap:5px;min-width:0}
.candidatebody strong{font-size:15px;font-weight:600;letter-spacing:-.02em}
.crossgroup{border-style:dashed;border-color:var(--lemon-ink)}
.pickersection{display:grid;gap:9px}
.pickersectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-top:6px;font-size:12.5px;font-weight:600}
.fallbacknotice{padding:11px 13px;border-radius:13px;background:var(--lemon);
  color:var(--lemon-ink);font-size:11.5px}
.drawerbg.matchgroup-open{justify-content:center;align-items:center;padding:18px}
.drawerbg.matchgroup-open .drawer{width:min(1120px,100%);height:min(860px,100%);border-radius:8px;
  box-shadow:0 24px 70px #14171C42;grid-template-rows:auto minmax(0,1fr);overflow:hidden}

function review(){if(S.bucket!=='review')return itemReview();const reimbursementRow=reimbursementReviewRows().find(x=>Number(x.id)===Number(S.selected));if(reimbursementRow)return renderReimbursementReview(reimbursementRow);const m=S.matches.find(x=>Number(x.id)===Number(S.selected));if(!m){$('reviewpanel').innerHTML=`<div class="empty">${esc(BHINT[S.bucket]||'เลือกคู่จากคิวด้านบน')}</div>`;return}const {bill:b,slip:s}=pairs(m),same=Math.abs(Number(amount(b))-Number(amount(s)))<.01,rs=reasons(m.reasons),amtflag=Number(s?.amount_review_flag||0)||Number(b?.amount_review_flag||0);$('reviewpanel').innerHTML=`<div class="reviewhead"><div><h2>${esc(pairTitle(b,m))}</h2><p class="sub">${esc(comparison(m,b,s))}${b?.bill_purpose?' · '+esc(b.bill_purpose):''}</p></div><span class="tag ${tone(m)}">${esc(label(m))}</span></div><div class="reviewbody">${amtflag?'<div class="summary" style="background:var(--redSoft);border-color:#fecaca;color:var(--red)">⚠ ยอดที่พิมพ์แจ้งในแชทไม่ตรงกับยอดในเอกสาร — ตรวจยอดให้ชัดก่อนยืนยัน</div>':''}<div class="signals"><div class="signal ${amtflag?'risk':same?'good':'review'}"><span>ยอด${amtflag?' · พิมพ์ไม่ตรงรูป':''}</span><strong>${esc(money(amount(b)))} / ${esc(money(amount(s)))}</strong></div><div class="signal good"><span>เวลา</span><strong>ห่าง ${esc(gap(b,s))}</strong></div><div class="signal ${b?.source_id===s?.source_id?'good':'risk'}"><span>กลุ่ม LINE</span><strong>${b?.source_id===s?.source_id?'กลุ่มเดียวกัน':'คนละกลุ่ม'}</strong></div></div><div class="summary">${esc(comparison(m,b,s))}</div><div class="docs">${doc('บิล',b,'บิล')}${doc('สลิป',s,'สลิป')}</div>${pagesStrip(b)}</div><details id="more"><summary>รายละเอียดเพิ่มเติม</summary><div class="detailsbody"><section class="section"><h3>แก้ข้อมูลบิล</h3><form class="form" id="form"><label>ชื่อร้าน<input class="input" id="vendor" value="${esc(b?.vendor_name||'')}"></label><label>ประเภท/รายการ (ค่าอะไร)<input class="input" id="purpose" value="${esc(b?.bill_purpose||'')}"></label><lab async function update(m,status){const note=String($('pair-review-note')?.value||'').trim(),learn=Boolean($('pair-ai-learn')?.checked);if(learn&&!note)return toast('กรอกหมายเหตุก่อนส่งเป็นตัวอย่างให้ AI');try{await api('/api/admin/matches',{method:'POST',body:JSON.stringify({bill_item_id:m.bill_item_id,slip_item_id:m.slip_item_id,score:m.score,status,reasons:[status==='confirmed'?'ยืนยันจากหน้า admin':'ปฏิเสธจากหน้า admin'],review_note:note,ai_learning_approved:learn})});toast(status==='confirmed'?'ยืนยันคู่แล้ว กำลังเปิดคู่ถัดไป':'ปฏิเสธคู่นี้แล้ว');S.selected=null;await data(false)}catch(e){toast(e.message)}}

function candidateScore(b,s){let l=Number(amount(b)),r=Number(amount(s)),x=0,d=l>0&&r>0?Math.abs(l-r):null,p=d===null?null:d/Math.max(1,l),h=Math.abs(Number(b?.event_timestamp_ms||0)-Number(s?.event_timestamp_ms||0))/3600000;if(d!==null){if(d<=5)x+=45;else if(p<=.02)x+=35;else if(p<=.05)x+=18;else if(p<=.15)x+=8}if(b?.source_id===s?.source_id)x+=20;if(b?.sender_user_id&&b.sender_user_id===s?.sender_user_id)x+=8;x+=!h||h<=.5?20:h<=1?17:h<=6?15:h<=24?10:5;return Math.min(99,Math.round(x+Math.min(10,Math.round(((Number(b?.ai_confidence||0)+Number(s?.ai_confidence||0))/2)*10))))}
function drawer(m){$('picker-title').textContent='เลือกสลิปใหม่';$('picker-subtitle').textContent='กลุ่ม LINE เดียวกัน · เลือกข้ามวันได้';const {bill:b}=pairs(m),c=(S.pool||S.items).filter(x=>Number(x.id)!==Number(m.slip_item_id)&&x.source_id===b?.source_id&&['transfer','transfer_notice'].includes(x.category)&&x.status!=='unsent'&&x.match_status!=='confirmed').map(s=>({s,n:candidateScore(b,s)})).sort((a,z)=>z.n-a.n);$('drawerlist').innerHTML=c.length?c.map(({s,n})=>`<button class="candidate" data-slip="${s.id}" data-score="${n}"><div class="candtop"><strong>${esc(money(amount(s)))}</strong><span class="tag ${n>=90?'good':'review'}">${n}%</span></div><span class="muted">${esc(when(s))} · ${esc(group(s.source_id))}${b&&dateOf(s)!==dateOf(b)?' · <b style="color:var(--amber)">คนละวัน</b>':''}</span><span class="sub">${Math.abs(Number(amount(b))-Number(amount(s)))<.01?'ยอดตรง':`ยอดต่าง ${money(Math.abs(Number(amount(b))-Number(amount(s))))}`}</span></button>`).join(''):'<div class="empty">ยังไม่มีสลิปอื่นที่เลือกได้ในกลุ่มนี้</div>';$('drawerbg').hidden=false;document.querySelectorAll('[data-slip]').forEach(e=>e.onclick=()=>replace(m,Number(e.dataset.slip),Number(e.dataset.score)))}

update=async function(m,status){
  const note=String($('pair-review-note')?.value||'').trim(),learn=Boolean($('pair-ai-learn')?.checked);
  if(learn&&!note)return toast('กรอกหมายเหตุก่อนส่งเป็นตัวอย่างให้ AI');
  const body={bill_item_id:m.bill_item_id,slip_item_id:m.slip_item_id,score:m.score,status,reasons:[status==='confirmed'?'ยืนยันจากหน้า admin':'ปฏิเสธจากหน้า admin'],review_note:note,ai_learning_approved:learn};
  try{
    await api('/api/admin/matches',{method:'POST',body:JSON.stringify(body)});
    S.selected=null;await data(false);
    offerUndo(status==='confirmed'?'ยืนยันคู่แล้ว · เปิดคู่ถัดไป':'บันทึกว่าไม่ใช่คู่นี้แล้ว',async()=>{await api('/api/admin/matches',{method:'POST',body:JSON.stringify({...body,status:'pending',reasons:['ย้อนกลับการตัดสินใจล่าสุดจากหน้า admin'],ai_learning_approved:false})});S.bucket='review';await data(false)});
  }catch(error){toast(error.message)}
};
async function unconfirmPair(bill){
  const slip=item(bill?.matched_item_id);if(!bill||!slip)return toast('ไม่พบคู่ที่ยืนยันแล้ว');

  const refresh=()=>{const billIds=chosen('bill'),slipIds=chosen('slip'),billTotal=sumDocs(billIds.map(item).filter(Boolean)),slipTotal=sumDocs(slipIds.map(item).filter(Boolean)),difference=billTotal-slipTotal,ready=billIds.length>0&&slipIds.length>0&&Math.abs(difference)<.01;$('group-bill-total').textContent=money(billTotal);$('group-slip-total').textContent=money(slipTotal);$('group-bill-label').textContent=`ยอดบิล · ${billIds.length} ใบ`;$('group-slip-label').textContent=`ยอดสลิป · ${slipIds.length} ใบ`;$('group-bill-count').textContent=`เลือก ${billIds.length} จาก ${bills.length}`;$('group-slip-count').textContent=`เลือก ${slipIds.length} จาก ${slips.length}`;$('group-difference').textContent=money(difference);$('group-difference').parentElement.className=`signal ${ready?'good':Math.abs(difference)<.01?'review':'risk'}`;$('group-match-note').textContent=ready?'ยอดรวมตรงกัน พร้อมสร้างชุด':!billIds.length||!slipIds.length?'เลือกบิลและสลิปอย่างน้อยฝั่งละ 1 รายการ':`ยังต่าง ${money(Math.abs(difference))} บาท`;$('save-match-group').disabled=!ready};

async function updateMatchGroup(match,status){const bills=matchBills(match),slips=matchSlips(match),body={bill_item_ids:bills.map(row=>row.id),slip_item_ids:slips.map(row=>row.id),status,reasons:[status==='confirmed'?'ยืนยันยอดรวมจากหน้า admin':'ปฏิเสธชุดรวมจากหน้า admin']};try{await api('/api/admin/match-groups',{method:'POST',body:JSON.stringify(body)});S.selected=null;await data(false);toast(status==='confirmed'?'ยืนยันชุดเอกสารแล้ว':'ยกเลิกชุดเอกสารแล้ว')}catch(error){toast(error.message)}}

const reviewBeforeMatchGroups=review;

  $('edit-match-group').onclick=()=>openMatchGroupPicker(match);$('reject-match-group').onclick=()=>updateMatchGroup(match,'rejected');$('confirm-match-group').onclick=()=>updateMatchGroup(match,'confirmed');
};

const enhanceWorkflowActionsBeforeGroups=enhanceWorkflowActions;
enhanceWorkflowActions=function(){enhanceWorkflowActionsBeforeGroups();const panel=$('reviewpanel');if(S.bucket==='review'){const match=S.matches.find(row=>Number(row.id)===Number(S.selected)),actions=panel.querySelector('.bar .actions');if(match&&!match.is_group&&actions&&!panel.querySelector('#combine-match')){const button=document.createElement('button');button.className='btn';button.id='combine-match';button.type='button';button.textContent='รวมบิล/สลิป';button.onclick=()=>openMatchGroupPicker(match);actions.insertBefore(button,actions.firstChild)}return}if(!['bill','slip'].includes(S.bucket))return;const row=item(S.selected),target=panel.querySelector('.itemdecision');if(row&&target&&!panel.querySelector('#combine-unmatched')){const button=document.createElement('button');button.className='btn';button.id='combine-unmatched';button.type='button';button.textContent='รวมหลายบิล/สลิป';button.onclick=()=>openMatchGroupPicker(row.category==='bill'?{bill_item_ids:[row.id]}:{slip_item_ids:[row.id]});target.append(button)}};
const itemReviewBeforeBatch=itemReview;

const renderBucketsBeforeBatch=renderBuckets;
renderBuckets=function(){renderBucketsBeforeBatch();const work=BUCKETS.filter(bucket=>!['done','other'].includes(bucket.k)).reduce((sum,bucket)=>sum+bucketRows(bucket.k).length,0);$('total').textContent=work?`ค้าง ${work}`:'เคลียร์ครบ';$('total').className=work?'tag review':'tag good'};
const processLocationBeforeBatch=processLocation;

markNotDocument=async function(row,label,reason){const previous=row.category;try{await api(`/api/admin/items/${row.id}/category`,{method:'PUT',body:JSON.stringify({category:'other',reason})});closeNotDocument();S.selected=null;await data(false);offerUndo(`บันทึกว่าไม่ใช่${label}แล้ว`,async()=>{await api(`/api/admin/items/${row.id}/category`,{method:'PUT',body:JSON.stringify({category:previous,reason:'ย้อนกลับการจัดประเภทล่าสุดจากหน้า admin'})});await data(false)})}catch(error){toast(error.message)}};

new MutationObserver(()=>{enhanceReceiptAction();enhancePairFeedback();enhanceNotDocumentAction();enhanceTransferRequestAction();enhanceDonePairReview();enhanceWorkflowActions();updateQueuePosition()}).observe($('reviewpanel'),{childList:true,subtree:true});
$('receipt-close').onclick=closeReceiptSubstitute;$('receipt-cancel').onclick=closeReceiptSubstitute;$('receiptbg').onclick=event=>{if(event.target===$('receiptbg'))closeReceiptSubstitute()};
$('receipt-form').onsubmit=async event=>{event.preventDefault();if(!receiptSlipId)return;const submit=$('receipt-submit'),reimbursementId=receiptReimbursementId;submit.disabled=true;try{await api('/api/admin/receipt-substitutes',{method:'POST',body:JSON.stringify({slip_item_id:receiptSlipId,document_date:$('receipt-date').value,payee_name:$('receipt-payee').value,payee_account:$('receipt-account').value,description:$('receipt-description').value})});if(reimbursementId)await api(`/api/admin/reimbursements/${reimbursementId}/review`,{method:'POST',body:JSON.stringify({status:'confirmed',evidence_mode:'receipt_substitute',review_note:'สร้างใบแทนใบเสร็จรับเงินจากหน้าตรวจคืนเงินสำรอง'})});closeReceiptSubstitute();toast(reimbursementId?'สร้างใบแทนและยืนยันการคืนเงินสำรองแล้ว':'สร้างใบแทนใบเสร็จและปิดยอดแล้ว');S.selected=null;await data(false)}catch(error){toast(error.message)}finally{submit.disabled=false}};
$('transfer-request-close').onclick=closeTransferRequest;$('transfer-request-cancel').onclick=closeTransferRequest;$('transfer-request-bg').onclick=event=>{if(event.target===$('transfer-request-bg'))closeTransferRequest()};

$('not-document-form').onsubmit=async event=>{event.preventDefault();if(!notDocumentItem)return;const reason=$('not-document-reason').value.trim();if(!reason)return;$('not-document-submit').disabled=true;try{await markNotDocument(notDocumentItem.row,notDocumentItem.label,reason)}finally{$('not-document-submit').disabled=false}};

<script>
// ---- ย่อ/ขยายแถบข้าง ----
// จำสถานะไว้ใน localStorage และกด [ เพื่อสลับ
(()=>{
  const app=document.querySelector('.app'),toggle=$('railtoggle');
  if(!app||!toggle)return;
  document.querySelectorAll('.ritem').forEach(button=>{
    const label=button.querySelector('.lb');
    if(label)button.dataset.tip=label.textContent.trim();
  });
  const setRail=(narrow,remember=true)=>{
    app.classList.toggle('narrow',narrow);
    toggle.title=narrow?'ขยายแถบข้าง ( [ )':'ย่อแถบข้าง ( [ )';
    toggle.setAttribute('aria-expanded',String(!narrow));
    if(remember)try{localStorage.setItem('bc.rail',narrow?'narrow':'wide')}catch{}
  };
  toggle.onclick=()=>setRail(!app.classList.contains('narrow'));
  document.addEventListener('keydown',event=>{
    if(event.key!=='['||event.metaKey||event.ctrlKey||event.altKey)return;
    const target=event.target;
    if(target&&(target.tagName==='INPUT'||target.tagName==='TEXTAREA'||target.isContentEditable))return;
    event.preventDefault();setRail(!app.classList.contains('narrow'));
  });
  let saved='wide';try{saved=localStorage.getItem('bc.rail')||'wide'}catch{}
  setRail(saved==='narrow',false);
})();

// ---- ลากปรับความกว้างแชท ----
// เก็บ "ความกว้างฐาน" ไว้ ส่วนโบนัสตอนหุบแถบข้างบวกให้ใน CSS จึงไม่เพี้ยนเวลาสลับหุบ/กาง
(()=>{
  const wrap=$('worklayout'),handle=$('chatresize'),app=document.querySelector('.app');
  if(!wrap||!handle||!app)return;
  const MIN=250,MAX=760,DEFAULT=318;
  const bonus=()=>app.classList.contains('narrow')?162:0;
  let base=DEFAULT;
  try{const v=parseInt(localStorage.getItem('bc.chatw'),10);if(v>=MIN&&v<=MAX)base=v}catch{}
  const apply=()=>{wrap.style.setProperty('--chatbase',base+'px');handle.setAttribute('aria-valuenow',String(base))};
  const save=()=>{try{localStorage.setItem('bc.chatw',String(base))}catch{}};
  apply();
  let dragging=false;
  handle.addEventListener('pointerdown',event=>{
    dragging=true;handle.classList.add('dragging');document.body.classList.add('chat-resizing');
    try{handle.setPointerCapture(event.pointerId)}catch{}
    event.preventDefault();
  });
  handle.addEventListener('pointermove',event=>{
    if(!dragging)return;
    const rect=wrap.getBoundingClientRect();
    base=Math.max(MIN,Math.min(MAX,Math.round(event.clientX-rect.left-bonus())));
    apply();
  });
  const stop=event=>{
    if(!dragging)return;dragging=false;handle.classList.remove('dragging');
    document.body.classList.remove('chat-resizing');
    try{handle.releasePointerCapture(event.pointerId)}catch{}
    save();
  };
  handle.addEventListener('pointerup',stop);handle.addEventListener('pointercancel',stop);
  handle.addEventListener('keydown',event=>{
    const step=event.shiftKey?40:12;
    if(event.key==='ArrowLeft')base=Math.max(MIN,base-step);
    else if(event.key==='ArrowRight')base=Math.min(MAX,base+step);
    else if(event.key==='Home')base=DEFAULT;
    else return;
    event.preventDefault();apply();save();
  });
  handle.addEventListener('dblclick',()=>{base=DEFAULT;apply();save();toast('รีเซ็ตความกว้างแชทแล้ว')});
})();

// ---- เมนูเครื่องมือ AI ----
(()=>{
  const root=$('aimenu'),toggle=$('ai-menu-toggle'),menu=$('ai-menu');
  const setOpen=open=>{root.classList.toggle('open',open);menu.hidden=!open;toggle.setAttribute('aria-expanded',String(open))};
  toggle.onclick=event=>{event.stopPropagation();setOpen(menu.hidden)};
  menu.onclick=event=>event.stopPropagation();
  ['run','rematch'].forEach(id=>$(id).addEventListener('click',()=>setOpen(false)));
  document.addEventListener('click',event=>{if(!root.contains(event.target))setOpen(false)});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')setOpen(false)});
})();

// ---- อ่านรูปใหม่ตามช่วงวันที่ ----
// POST ai/reset-all รับแค่ start/end (ไม่มี source_id) จึงมีผลทุกกลุ่มในช่วงนั้น
// และมันตีคู่ที่ "AI สร้าง" กลับเป็น rejected รวมถึงคู่ที่ยืนยันไปแล้ว จึงต้องเตือนให้ครบ
$('reread').onclick=async()=>{
  const inDay=S.view==='day'&&S.start;
  // บนหน้าแรก S.bStart/bEnd จะว่างจนกว่าจะกดเปลี่ยนเดือน จึงต้องอ่านจากเดือนที่แสดงอยู่จริง
  const bounds=!inDay&&S.calendarMonth?calendarBounds(S.calendarMonth):null;
  const start=inDay?S.start:(S.bStart||bounds?.start||S.start||'');
  const end=inDay?S.start:(S.bEnd||bounds?.end||S.end||'');
  if(!start||!end)return toast('ยังไม่รู้ช่วงวันที่ที่จะอ่านใหม่');
  const scope=start===end?`วันที่ ${start}`:`ช่วง ${start} ถึง ${end}`;
  const warn=[
    `ให้ AI อ่านรูปใหม่ใน${scope}`,
    '',
    'สิ่งที่จะเกิดขึ้น',
    '· รูปที่ AI เคยอ่านจะถูกอ่านใหม่ตามกติกาล่าสุด',
    '· คู่ที่ AI จับให้ จะถูกยกเลิกกลับไปรอตรวจ รวมถึงคู่ที่ยืนยันไปแล้ว',
    '· มีผลกับทุกกลุ่ม LINE ในช่วงวันนี้ ไม่ใช่เฉพาะกลุ่มที่เลือกอยู่',
    '',
    'สิ่งที่ยังอยู่เหมือนเดิม',
    '· การแก้หมวดหมู่ด้วยมือ (ไม่ใช่บิล / นี่คือสลิป ฯลฯ)',
    '· คู่ที่จับด้วยมือจากหน้า admin',
    '· รอบที่ปิดไปแล้ว จะถูกเปิดใหม่ถ้าคู่ในรอบนั้นเปลี่ยน',
    '',
    'ยืนยันหรือไม่?'
  ].join('\n');
  if(!confirm(warn))return;
  const button=$('reread');button.disabled=true;
  try{
    const response=await api('/api/admin/ai/reset-all',{method:'POST',body:JSON.stringify({start,end})});
    const result=response.data||{};
    toast(`สั่งอ่านใหม่ ${Number(result.requeued||0)} รูป · ยกเลิกคู่ที่ AI จับ ${Number(result.reset_ai_matches||0)} คู่ · เก็บหมวดที่แก้เอง ${Number(result.preserved_manual_categories||0)} รูป`);
    await Promise.all([ai(),loadDays()]);
    if(S.view==='day')await data(false);else renderBoard();
    syncView();
  }catch(error){toast(error.message)}finally{button.disabled=false}
};

// เงินรับเข้ายังอยู่ในถัง "อื่น ๆ" เพื่อไม่ให้เข้ากระบวนการจับคู่ค่าใช้จ่าย
// แต่แสดงชื่อและยอดให้ชัดเจนว่าเป็นธุรกรรมคนละทิศทางกับสลิปจ่าย
const processLocationBeforeIncoming=processLocation,itemReviewBeforeIncoming=itemReview,chatMessagesBeforeIncoming=chatMessages;
processLocation=function(row){if(row?.category==='incoming_transfer')return{bucket:'other',label:'เงินโอนเข้า',itemId:Number(row.id)};return processLocationBeforeIncoming(row)};
itemReview=function(){itemReviewBeforeIncoming();const row=item(S.selected);if(row?.category!=='incoming_transfer')return;const panel=$('reviewpanel'),heading=panel.querySelector('.reviewhead h2'),subtitle=panel.querySelector('.reviewhead .sub'),note=panel.querySelector('.tasknote');if(heading)heading.textContent=`เงินโอนเข้า #${row.id}`;if(subtitle)subtitle.textContent=`เงินโอนเข้า · รูป #${row.id} · ${group(row.source_id)}`;if(note)note.textContent='เงินรับเข้าบัญชี ไม่นำไปจับคู่กับบิลหรือรวมเป็นยอดจ่าย'};
chatMessages=function(messages=[],focusIds=new Set()){let markup=chatMessagesBeforeIncoming(messages,focusIds);for(const message of messages){const row=item(message.capture_item_id);if(row?.category==='incoming_transfer')markup=markup.split(`รูปที่คาดว่าไม่เกี่ยว #${Number(row.id)}`).join(`เงินโอนเข้า #${Number(row.id)}`)}return markup};

// ---- ค้นหาทั่วระบบ ----
(()=>{
  const root=$('global-search-wrap'),input=$('global-search'),clear=$('global-search-clear'),results=$('global-search-results');
  let timer=0,requestToken=0,rows=[],active=-1;
  const categoryLabel=row=>row.category==='bill'?'บิล':isSlip(row)?'สลิปจ่าย':row.category==='incoming_transfer'?'เงินโอนเข้า':row.category==='bill_page'?'เอกสารประกอบ':'รูปอื่น';
  const close=()=>{results.hidden=true;active=-1};
  const paintActive=()=>results.querySelectorAll('[data-search-index]').forEach((button,index)=>button.classList.toggle('active',index===active));
  const resultMarkup=(row,index)=>`<a class="searchresult" role="option" data-search-index="${index}" href="${esc(dayHref(dateOf(row),row.source_id))}"><img loading="lazy" alt="รูป #${row.id}" src="/api/admin/items/${row.id}/image"><span class="searchresultbody"><span class="searchresulttitle">${esc(itemTitle(row)||row.doc_ref||`${categoryLabel(row)} #${row.id}`)}</span><span class="searchresultmeta">#${row.id} · ${esc(group(row.source_id))} · ${esc(shortThaiDate(dateOf(row)))} · ${esc(senderName(row))}</span></span><span class="searchresultside"><strong>${esc(money(amount(row)))}</strong><small>${esc(categoryLabel(row))}</small></span></a>`;
  const render=()=>{results.innerHTML=rows.length?rows.map(resultMarkup).join(''):'<div class="searchstate">ไม่พบเอกสารที่ตรงกับคำค้น</div>';results.hidden=false;results.querySelectorAll('[data-search-index]').forEach(button=>button.onclick=()=>openResult(rows[Number(button.dataset.searchIndex)]))};
  const search=async()=>{
    const query=input.value.trim();clear.hidden=!query;
    if(query.length<2){close();return}
    const token=++requestToken;results.innerHTML='<div class="searchstate">กำลังค้นหา...</div>';results.hidden=false;
    try{const response=await api('/api/admin/items?'+new URLSearchParams({search:query,limit:'30'}));if(token!==requestToken)return;rows=response.data||[];active=-1;render()}catch(error){if(token!==requestToken)return;results.innerHTML=`<div class="searchstate">ค้นหาไม่ได้ · ${esc(error.message)}</div>`;results.hidden=false}
  };
  async function openResult(row){
    if(!row)return;input.value='';clear.hidden=true;close();
    let target=row;await openDay(dateOf(row),row.source_id);
    target=item(row.id)||row;
    if(target.match_status==='pending'&&isSlip(target)&&Number(target.matched_item_id||0)){const bill=item(target.matched_item_id);if(bill&&dateOf(bill)!==dateOf(target)){await openDay(dateOf(bill),bill.source_id);target=item(row.id)||target}}
    if(target.match_status==='pending'){
      const match=S.matches.find(candidate=>Number(candidate.bill_item_id)===Number(target.id)||Number(candidate.slip_item_id)===Number(target.id));
      S.bucket='review';S.selected=match?.id??null;
    }else if(target.match_status==='confirmed'){
      S.bucket='done';S.selected=target.category==='bill'?target.id:Number(target.matched_item_id||0);
    }else if(target.category==='bill'){
      S.bucket=target.match_status==='needs_amount'?'needs_amount':'bill';S.selected=target.id;
    }else if(isSlip(target)){
      S.bucket='slip';S.selected=target.id;
    }else if(target.category==='bill_page'&&isOrphanPage(target)){
      S.bucket='orphan_page';S.selected=target.id;
    }else{
      S.bucket='other';S.selected=target.id;
    }
    renderBuckets();renderList();review();renderChatPanel();
    $('reviewpanel').scrollIntoView({behavior:'smooth',block:'start'});
  }
  input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,240)});
  input.addEventListener('focus',()=>{if(rows.length&&input.value.trim().length>=2)results.hidden=false});
  input.addEventListener('keydown',event=>{
    if(event.key==='Escape'){close();input.blur();return}
    if(results.hidden||!rows.length)return;
    if(event.key==='ArrowDown'){event.preventDefault();active=(active+1)%rows.length;paintActive()}
    else if(event.key==='ArrowUp'){event.preventDefault();active=(active-1+rows.length)%rows.length;paintActive()}
    else if(event.key==='Enter'&&active>=0){event.preventDefault();openResult(rows[active])}
  });
  clear.onclick=()=>{clearTimeout(timer);requestToken+=1;input.value='';clear.hidden=true;rows=[];close();input.focus()};
  document.addEventListener('click',event=>{if(!root.contains(event.target))close()});
})();
</script>

<script>
// ---- ความคืบหน้าการอ่านรูปของ AI ----
// ป้าย AI บนหัวเว็บเดิมบอกแค่จำนวนคงค้าง ณ ตอนที่กดโหลด
// ตัวนี้ถามสถานะซ้ำทุก 3 วิระหว่างที่ยังมีคิว แล้วแสดงเป็น "อ่านแล้ว x/y" พร้อมแถบ
(()=>{
  const el=$('ai');
  let total=0,timer=0,wasWorking=false;
  const parse=data=>{
    const rows=data?.queue?.by_ai_status||[];
    const count=key=>Number(rows.find(row=>row.ai_status===key)?.count||0);
    return {enabled:Boolean(data?.enabled),pending:count('pending'),processing:count('processing'),
      failed:count('failed'),usage:data?.queue?.token_usage||{}};
  };
  const paint=state=>{
    const left=state.pending+state.processing;
    const usage=state.usage||{},tokens=Number(usage.total_tokens||0);
    el.title=Number(usage.tracked_items||0)
      ? `บันทึก token แล้ว ${usage.tracked_items} รูป · รวม ${tokens.toLocaleString()}`
      : 'ระบบจะเริ่มบันทึก token ตั้งแต่การวิเคราะห์ครั้งถัดไป';
    if(!state.enabled){
      total=0;el.className='tag ai idlequeue';el.style.removeProperty('--p');
      el.textContent=left?`AI ปิด · คิว ${left}`:'AI ปิด';return;
    }
    if(!left){
      total=0;el.className='tag ai';el.style.removeProperty('--p');
      el.textContent=`AI พร้อม${tokens?` · ${compactNumber(tokens)} tk`:''}`;return;
    }
    if(left>total)total=left;
    const done=Math.max(0,total-left);
    el.className='tag ai working';
    el.style.setProperty('--p',Math.round(done/total*100)+'%');
    el.textContent=`AI อ่านแล้ว ${done}/${total}`;
  };
  const refreshViews=async()=>{
    try{await loadDays();if(S.view==='day')await data(false);else if(S.view==='board')renderBoard();syncView()}catch{}
  };
  const poll=async()=>{
    clearTimeout(timer);timer=0;
    let state;
    try{const response=await api('/api/admin/ai/status');state=parse(response.data||{})}catch{return}
    paint(state);
    const left=state.pending+state.processing;
    if(state.enabled&&left>0){wasWorking=true;timer=setTimeout(poll,3000);return}
    if(wasWorking){wasWorking=false;toast('AI อ่านรูปครบแล้ว กำลังรีเฟรชข้อมูล');await refreshViews()}
  };
  ai=poll;          // ทุกที่ที่เรียก ai() เดิม จะได้ progress ไปด้วย
  window.aiPoll=poll;
  poll();
})();
</script>
