apply plugin: 'com.android.application'

android {
    namespace "th.co.solao.receiving"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "th.co.solao.receiving"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "0.7.1-debug"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
    signingConfigs {
        debug {
            // Only the standard debug signing file, generated on the SSD.
            storeFile file(System.getenv('SOLAO_DEBUG_KEYSTORE') ?: "${System.getenv('GRADLE_USER_HOME')}/debug.keystore")
        }
    }
    buildTypes {
        debug {
            // Third-party auth plugins may log credential objects: strip Log
            // calls in every distributable variant, including debug APKs.
            // R8 does not optimize debuggable variants, so this review APK
            // deliberately disables debugger attachment to enforce stripping.
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation 'androidx.work:work-testing:2.9.1'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Owner supplies an external file only when enabling FCM. No file = keyless build.
def receivingGoogleConfig = System.getenv('RECEIVING_GOOGLE_SERVICES_FILE')
if (receivingGoogleConfig) {
    apply plugin: 'com.google.gms.google-services'
    tasks.withType(com.google.gms.googleservices.GoogleServicesTask).configureEach {
        googleServicesJsonFiles.set([file(receivingGoogleConfig)])
    }
}

// Run on an SSD snapshot with TMPDIR on the verified SOLAO SSD. Release stays
// unsigned; this check never loads or requires a release signing configuration.
tasks.register('verifyReceivingApkMetadata', Exec) {
    dependsOn 'assembleDebug', 'assembleRelease'
    workingDir rootProject.projectDir
    commandLine 'python3', '-B', 'tests/verify-apk-metadata.py',
        '--dexdump', "${android.sdkDirectory}/build-tools/${android.buildToolsVersion}/dexdump",
        "${layout.buildDirectory.get()}/outputs/apk/debug/app-debug.apk",
        "${layout.buildDirectory.get()}/outputs/apk/release/app-release-unsigned.apk"
}
