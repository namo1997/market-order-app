// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Capacitor 7 templates request Java 21; this debug project is compiled with
// the explicitly supplied JDK 17. Apply after every plugin's generated config.
subprojects {
    // Capgo's disabled Apple provider is compileOnly browser 1.9, while its
    // Google helper requests 1.4 at runtime. Align both for Capacitor 7/AGP 8.7.
    configurations.configureEach {
        resolutionStrategy.force 'androidx.browser:browser:1.8.0'
    }
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
}
