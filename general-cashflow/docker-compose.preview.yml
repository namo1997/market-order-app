services:
  mysql:
    # MariaDB is protocol-compatible with the application's MySQL client and
    # keeps the preview lightweight on developer machines that already use it.
    image: mariadb:10.8
    environment:
      MYSQL_ROOT_PASSWORD: preview-root
      MYSQL_DATABASE: general_cashflow_preview
      MYSQL_USER: cashflow_preview
      MYSQL_PASSWORD: cashflow-preview
    ports:
      - "127.0.0.1:3317:3306"
    volumes:
      - cashflow-preview-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucashflow_preview", "-pcashflow-preview"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  cashflow-preview-mysql:
